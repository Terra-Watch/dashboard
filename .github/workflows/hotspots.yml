name: satellite-detections
# Every 3 hours: fetch NASA FIRMS near-real-time detections for India and post them to the dashboard, which stores them and alerts staff about new clusters.
# Needs the repository secrets FIRMS_MAP_KEY, RISK_INGEST_URL and RISK_INGEST_TOKEN (the same ones the daily forecast uses).
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
concurrency:
  group: satellite-detections
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install httpx
      - env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          RISK_INGEST_URL: ${{ secrets.RISK_INGEST_URL }}
          RISK_INGEST_TOKEN: ${{ secrets.RISK_INGEST_TOKEN }}
        run: python forecast/live/post_hotspots.py
