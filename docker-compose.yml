services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: resq
      POSTGRES_USER: resq
      POSTGRES_PASSWORD: resq
    ports: ["55432:5432"]
    volumes: [resq_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resq -d resq"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  resq_postgres:
